name: Build & Publish Arch Repo

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
  workflow_dispatch: {}

concurrency:
  group: build-repo-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- EDIT THESE ---
  REPO_NAME: barbel          # name of your pacman repo (barbel.db.tar.gz etc.)
  R2_BUCKET: barbel-repo      # your R2 bucket name (not in the secrets you pasted - add it)
  # -------------------

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build package matrix
        id: set-matrix
        run: |
          set -euo pipefail
          matrix=$(
            {
              for group in aur own; do
                dir="packages/$group"
                [ -d "$dir" ] || continue
                for pkgdir in "$dir"/*/; do
                  [ -f "${pkgdir}PKGBUILD" ] || continue
                  name=$(basename "$pkgdir")
                  jq -nc --arg name "$name" --arg group "$group" '{name:$name, group:$group}'
                done
              done
            } | jq -sc '{include: .}'
          )

          count=$(echo "$matrix" | jq '.include | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No PKGBUILD directories found under packages/aur or packages/own"
            exit 1
          fi

          echo "Discovered $count packages"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Prep base system
        run: |
          pacman -Syu --noconfirm --needed git sudo jq

      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Init package submodule (if it is one)
        run: |
          set -euo pipefail
          PKG_PATH="packages/${{ matrix.group }}/${{ matrix.name }}"
          if [ -f .gitmodules ] && git config -f .gitmodules --get-regexp '\.path$' \
              | awk '{print $2}' | grep -qx "$PKG_PATH"; then
            echo "$PKG_PATH is a submodule, initializing."
            git submodule update --init --depth 1 -- "$PKG_PATH"
          else
            echo "$PKG_PATH is not a submodule, nothing to init."
          fi

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY_RAW: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "Secret length (chars): ${#GPG_PRIVATE_KEY_RAW}"
          echo "First line: $(printf '%s\n' "$GPG_PRIVATE_KEY_RAW" | head -1)"
          echo "Last line:  $(printf '%s\n' "$GPG_PRIVATE_KEY_RAW" | tail -1)"

          # Try raw armored text first (works if the secret is the direct gpg --export-secret-keys --armor output)
          if printf '%s\n' "$GPG_PRIVATE_KEY_RAW" | gpg --batch --import 2>/tmp/import.log; then
            echo "Imported as raw armored text."
          # Fall back to base64 (works if the secret is base64-encoded)
          elif printf '%s\n' "$GPG_PRIVATE_KEY_RAW" | base64 -d 2>/dev/null | gpg --batch --import 2>>/tmp/import.log; then
            echo "Imported as base64."
          else
            echo "::error::GPG import failed both as raw armor and as base64."
            cat /tmp/import.log
            exit 1
          fi
          echo "default-key ${{ secrets.GPG_KEY_ID }}" >> ~/.gnupg/gpg.conf || true

      - name: Debug package directory
        run: |
          echo "== ls -la =="
          ls -la "packages/${{ matrix.group }}/${{ matrix.name }}" || true
          echo "== git ls-files (is PKGBUILD tracked in this commit?) =="
          git ls-files "packages/${{ matrix.group }}/${{ matrix.name }}"
          echo "== git check-ignore -v (is it gitignored?) =="
          git check-ignore -v "packages/${{ matrix.group }}/${{ matrix.name }}/PKGBUILD" || echo "not ignored"
          echo "== does PKGBUILD exist in HEAD? =="
          git cat-file -e "HEAD:packages/${{ matrix.group }}/${{ matrix.name }}/PKGBUILD" \
            && echo "YES - present in HEAD commit" \
            || echo "NO - not present in HEAD commit (never committed, or wrong path)"

      - name: Build package
        run: |
          set -euo pipefail
          cd "packages/${{ matrix.group }}/${{ matrix.name }}"
          sudo -u builder makepkg --syncdeps --noconfirm --clean

      - name: Sign built packages
        run: |
          set -euo pipefail
          cd "packages/${{ matrix.group }}/${{ matrix.name }}"
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::No package produced for ${{ matrix.name }}"
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --local-user "${{ secrets.GPG_KEY_ID }}" \
              --detach-sign --output "${pkg}.sig" "$pkg"
          done
          mkdir -p /tmp/out
          cp "${pkgs[@]}" *.sig /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.group }}-${{ matrix.name }}
          path: /tmp/out/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Prep tools
        run: pacman -Syu --noconfirm --needed gnupg pacman-contrib awscli

      - uses: actions/download-artifact@v4
        with:
          path: repo-out
          pattern: pkg-*
          merge-multiple: true

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY_RAW: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if printf '%s\n' "$GPG_PRIVATE_KEY_RAW" | gpg --batch --import 2>/tmp/import.log; then
            echo "Imported as raw armored text."
          elif printf '%s\n' "$GPG_PRIVATE_KEY_RAW" | base64 -d 2>/dev/null | gpg --batch --import 2>>/tmp/import.log; then
            echo "Imported as base64."
          else
            echo "::error::GPG import failed both as raw armor and as base64."
            cat /tmp/import.log
            exit 1
          fi

      - name: Build repo database
        run: |
          set -euo pipefail
          cd repo-out
          ls -la
          repo-add --sign --key "${{ secrets.GPG_KEY_ID }}" \
            --nocolor \
            "${{ env.REPO_NAME }}.db.tar.gz" *.pkg.tar.zst

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync repo-out/ "s3://${{ env.R2_BUCKET }}/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --no-progress
