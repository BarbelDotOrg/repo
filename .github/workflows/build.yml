name: Build & Publish Arch Repo

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
  workflow_dispatch: {}

concurrency:
  group: build-repo-${{ github.ref }}
  cancel-in-progress: true

env:
  # --- EDIT THESE ---
  REPO_NAME: barbel          # name of your pacman repo (barbel.db.tar.gz etc.)
  R2_BUCKET: barbel-repo      # your R2 bucket name (not in the secrets you pasted - add it)
  # -------------------

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build package matrix
        id: set-matrix
        run: |
          set -euo pipefail
          matrix=$(
            {
              for group in aur own; do
                dir="packages/$group"
                [ -d "$dir" ] || continue
                for pkgdir in "$dir"/*/; do
                  [ -f "${pkgdir}PKGBUILD" ] || continue
                  name=$(basename "$pkgdir")
                  jq -nc --arg name "$name" --arg group "$group" '{name:$name, group:$group}'
                done
              done
            } | jq -sc '{include: .}'
          )

          count=$(echo "$matrix" | jq '.include | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No PKGBUILD directories found under packages/aur or packages/own"
            exit 1
          fi

          echo "Discovered $count packages"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Prep base system
        run: |
          pacman -Syu --noconfirm --needed git sudo jq

      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodule (aur packages only)
        if: matrix.group == 'aur'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 -- "packages/${{ matrix.group }}/${{ matrix.name }}"

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "default-key ${{ secrets.GPG_KEY_ID }}" >> ~/.gnupg/gpg.conf || true

      - name: Build package
        run: |
          set -euo pipefail
          cd "packages/${{ matrix.group }}/${{ matrix.name }}"
          sudo -u builder makepkg --syncdeps --noconfirm --clean

      - name: Sign built packages
        run: |
          set -euo pipefail
          cd "packages/${{ matrix.group }}/${{ matrix.name }}"
          shopt -s nullglob
          pkgs=(*.pkg.tar.zst)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::No package produced for ${{ matrix.name }}"
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --local-user "${{ secrets.GPG_KEY_ID }}" \
              --detach-sign --output "${pkg}.sig" "$pkg"
          done
          mkdir -p /tmp/out
          cp "${pkgs[@]}" *.sig /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.group }}-${{ matrix.name }}
          path: /tmp/out/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Prep tools
        run: pacman -Syu --noconfirm --needed gnupg pacman-contrib awscli

      - uses: actions/download-artifact@v4
        with:
          path: repo-out
          pattern: pkg-*
          merge-multiple: true

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Build repo database
        run: |
          set -euo pipefail
          cd repo-out
          ls -la
          repo-add --sign --key "${{ secrets.GPG_KEY_ID }}" \
            --nocolor \
            "${{ env.REPO_NAME }}.db.tar.gz" *.pkg.tar.zst

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync repo-out/ "s3://${{ env.R2_BUCKET }}/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --no-progress
