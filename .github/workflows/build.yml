name: Build package
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      package_path:
        description: 'Path to the package dir, e.g. packages/own/charist'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git (required before checkout)
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install remaining build tooling
        run: pacman -Syu --noconfirm --needed base-devel

      - name: Compute artifact-safe name
        id: name
        run: echo "name=pkg-$(echo '${{ inputs.package_path }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Install AUR helper
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "
            cd /tmp &&
            git clone https://aur.archlinux.org/paru-bin.git &&
            cd paru-bin &&
            makepkg -si --noconfirm
          "
      
      - name: Build package
        run: |
          su builder -c "cd '${{ inputs.package_path }}' && paru -B --noconfirm ."

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ inputs.package_path }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1
