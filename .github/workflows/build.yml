name: Build package
permissions:
  contents: write
on:
  workflow_call:
    inputs:
      package_path:
        description: 'Path to the package dir, e.g. packages/own/charist'
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git (required before checkout)
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init and update only the target submodule
        run: |
          git config --global --add safe.directory "$(pwd)"
          git submodule update --init --recursive -- "${{ inputs.package_path }}"

      - name: Debug submodule state
        run: |
          echo "---- git submodule status ----"
          git submodule status
          echo "---- superproject-recorded SHA for this path ----"
          git ls-tree HEAD "${{ inputs.package_path }}"
          echo "---- actual HEAD inside submodule ----"
          git -C "${{ inputs.package_path }}" log -1 --oneline || echo "not a git dir / not checked out"
          echo "---- working tree contents ----"
          ls -la "${{ inputs.package_path }}"
          ls -la "${{ inputs.package_path }}/src" 2>&1 || echo "no src dir"
          echo "---- Cargo.toml as checked out ----"
          cat "${{ inputs.package_path }}/Cargo.toml" 2>&1 || echo "no Cargo.toml"

      - name: Install remaining build tooling
        run: pacman -Syu --noconfirm --needed base-devel rust

      - name: Compute artifact-safe name
        id: name
        run: echo "name=pkg-$(echo '${{ inputs.package_path }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Clone paru AUR repo (for PKGBUILD hash + build fallback)
        run: git clone --depth 1 https://aur.archlinux.org/paru.git /tmp/paru

      - name: Cache built paru package
        id: paru-cache
        uses: actions/cache@v4
        with:
          path: /tmp/paru-pkg
          key: paru-pkg-${{ hashFiles('/tmp/paru/PKGBUILD') }}

      - name: Set up builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder . /tmp/paru
          mkdir -p /tmp/paru-pkg
          chown -R builder:builder /tmp/paru-pkg

      - name: Build paru (cache miss only)
        if: steps.paru-cache.outputs.cache-hit != 'true'
        run: |
          su builder -c "
            cd /tmp/paru &&
            makepkg --noconfirm
          "
          cp /tmp/paru/*.pkg.tar.zst /tmp/paru-pkg/

      - name: Install paru
        run: pacman -U --noconfirm /tmp/paru-pkg/*.pkg.tar.zst

      - name: Build package
        run: |
          su builder -c "cd '${{ inputs.package_path }}' && paru -B --noconfirm ."

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ inputs.package_path }}/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1
